name: "Setup New Laravel Server"

on:
  # This workflow is manual only. You run it once per new server.
  workflow_dispatch: {}

jobs:
  setup-server:
    runs-on: ubuntu-latest
    name: Prepare Server for Laravel

    steps:
      - name: Configure Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Starting server setup..."
            # Use DEBIAN_FRONTEND to avoid interactive prompts during installation
            export DEBIAN_FRONTEND=noninteractive

            # --- 1. Install System Dependencies ---
            echo "Installing PHP, Composer, and other utilities..."
            sudo apt-get update -y
            # Install PHP 8.2 (common for modern Laravel) and required extensions
            sudo apt-get install -y php8.2-fpm php8.2-mysql php8.2-xml php8.2-mbstring php8.2-curl php8.2-bcmath composer git unzip
            
            # --- 2. Create Project Directory & Set Permissions ---
            echo "Creating project directory..."
            # Create the directory where the code will live
            sudo mkdir -p /var/www/html/backend
            # Give ownership to the 'ubuntu' user so it can clone without sudo
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/html/backend

            # --- 3. Configure Nginx ---
            echo "Configuring Nginx site..."
            # Create a new Nginx configuration file for our Laravel site
            # We use a HEREDOC (<<'EOF') to write a multi-line file
            sudo bash -c "cat > /etc/nginx/sites-available/backend" <<'EOF'
            server {
                listen 80;
                server_name ${{ secrets.BACKEND_HOST }};
                root /var/www/html/backend/public;

                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-XSS-Protection "1; mode=block";
                add_header X-Content-Type-Options "nosniff";

                index index.php;

                charset utf-8;

                location / {
                    try_files \$uri \$uri/ /index.php?\$query_string;
                }

                location = /favicon.ico { access_log off; log_not_found off; }
                location = /robots.txt  { access_log off; log_not_found off; }

                error_page 404 /index.php;

                location ~ \.php$ {
                    include snippets/fastcgi-php.conf;
                    # Make sure the PHP version matches what was installed
                    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
                }

                location ~ /\.(?!well-known).* {
                    deny all;
                }
            }
            EOF

            # --- 4. Enable the New Nginx Site ---
            echo "Enabling Nginx site..."
            # Create a symbolic link to enable the site
            sudo ln -s /etc/nginx/sites-available/backend /etc/nginx/sites-enabled/
            # Remove the default Nginx configuration to avoid conflicts
            sudo rm /etc/nginx/sites-enabled/default
            
            # Test Nginx configuration for syntax errors
            sudo nginx -t
            # Reload Nginx to apply the new configuration
            sudo systemctl reload nginx

            # --- 5. Configure Firewall ---
            echo "Configuring Firewall (UFW)..."
            sudo ufw allow 'Nginx Full'
            # Enable the firewall, '--force' is needed for non-interactive scripts
            sudo ufw --force enable

            echo "✅ Server Setup Completed Successfully!"